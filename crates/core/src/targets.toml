[[target]]
id = "vscode"
name = "Visual Studio Code"
group = "Applications"
level = "safe"
description = "Caches, old compiled data, downloaded extension packages and logs."
paths = [
  '%APPDATA%\Code\Cache',
  '%APPDATA%\Code\CachedData',
  '%APPDATA%\Code\Code Cache',
