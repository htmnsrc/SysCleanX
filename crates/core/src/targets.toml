]
processes = ["steam.exe"]

[[target]]
id = "epic"
name = "Epic Games Launcher"
group = "Applications"
level = "safe"
paths = ['%LOCALAPPDATA%\EpicGamesLauncher\Saved\webcache*', '%LOCALAPPDATA%\EpicGamesLauncher\Saved\Logs']
processes = ["epicgameslauncher.exe"]

[[target]]
id = "battlenet"
name = "Battle.net"
group = "Applications"
level = "safe"
paths = ['%LOCALAPPDATA%\Battle.net\Cache', '%LOCALAPPDATA%\Battle.net\BrowserCache', '%LOCALAPPDATA%\Battle.net\Logs']
processes = ["battle.net.exe"]

[[target]]
id = "java"
name = "Java cache"
group = "Applications"
level = "safe"
paths = ['%USERPROFILE%\AppData\LocalLow\Sun\Java\Deployment\cache']

[[target]]
id = "adobe-media-cache"
name = "Adobe media cache"
group = "Applications"
level = "recommended"
description = "Premiere Pro / After Effects media cache. Rebuilt when projects are opened."
paths = ['%APPDATA%\Adobe\Common\Media Cache Files', '%APPDATA%\Adobe\Common\Media Cache', '%APPDATA%\Adobe\Common\Peak Files']
processes = ["adobe premiere pro.exe", "afterfx.exe", "adobe media encoder.exe"]

[[target]]
id = "onedrive-logs"
name = "OneDrive logs"
group = "Applications"
level = "safe"
paths = ['%LOCALAPPDATA%\Microsoft\OneDrive\logs']
min_age_hours = 168

# ────────────────────────────── Developer ─────────────────────────────

[[target]]
id = "pip-cache"
name = "pip cache"
group = "Developer"
level = "recommended"
default_on = false
paths = ['%LOCALAPPDATA%\pip\cache']

[[target]]
id = "npm-cache"
name = "npm cache"
group = "Developer"
level = "recommended"
default_on = false
paths = ['%LOCALAPPDATA%\npm-cache', '%APPDATA%\npm-cache']

[[target]]
id = "yarn-cache"
name = "Yarn cache"
group = "Developer"
level = "recommended"
default_on = false
paths = ['%LOCALAPPDATA%\Yarn\Cache']

[[target]]
id = "nuget-cache"
name = "NuGet HTTP cache"
group = "Developer"
level = "recommended"
default_on = false
paths = ['%LOCALAPPDATA%\NuGet\v3-cache', '%LOCALAPPDATA%\NuGet\plugins-cache']

[[target]]
id = "gradle-cache"
name = "Gradle caches"
group = "Developer"
level = "recommended"
default_on = false
description = "Downloaded dependencies and build caches. The next build downloads them again."
paths = ['%USERPROFILE%\.gradle\caches']
processes = ["java.exe"]

[[target]]
id = "go-cache"
name = "Go build cache"
group = "Developer"
level = "recommended"
default_on = false
paths = ['%LOCALAPPDATA%\go-build']

[[target]]
id = "cargo-cache"
name = "Cargo registry cache"
group = "Developer"
level = "recommended"
default_on = false
description = "Downloaded crate archives (extracted sources are kept)."
paths = ['%USERPROFILE%\.cargo\registry\cache']

# ───────────────────────────── Deep Clean ─────────────────────────────

[[target]]
id = "app-caches"
name = "Other app caches (auto-detected)"
group = "Deep Clean"
level = "recommended"
description = "Chromium, Electron and WebView2 caches of any other app under AppData."
resolver = "app-caches"

[[target]]
id = "crash-reports"
name = "App crash reports"
group = "Deep Clean"
level = "safe"
paths = [
  '%LOCALAPPDATA%\*\Crashpad\reports',
  '%LOCALAPPDATA%\*\*\Crashpad\reports',
  '%APPDATA%\*\Crashpad\reports',
  '%LOCALAPPDATA%\*\CrashReports',
  '%LOCALAPPDATA%\*\*\CrashReports',
  '%LOCALAPPDATA%\CrashReportClient',
]

[[target]]
id = "old-temp-files"
name = "Stray temporary files"
group = "Deep Clean"
level = "recommended"
description = "*.tmp files older than 7 days left behind anywhere in AppData. App databases are skipped."
paths = ['%LOCALAPPDATA%', '%APPDATA%', '%USERPROFILE%\AppData\LocalLow']
include = ["*.tmp", "*.temp", "*._mp", "~*.tmp"]
exclude_paths = ['%LOCALAPPDATA%\Temp', '%LOCALAPPDATA%\Packages']
min_age_hours = 168
skip_markers = true

[[target]]
id = "old-log-files"
name = "Old log files"
group = "Deep Clean"
level = "recommended"
description = "App log files untouched for 14 days. Database transaction logs are never touched."
paths = ['%LOCALAPPDATA%', '%APPDATA%', '%USERPROFILE%\AppData\LocalLow']
include = ["*.log", "*.log.old", "*.log.bak", "*.log.?"]
exclude = ["edb*.log", "v01*.log", "res*.log", "*.jrs"]
exclude_paths = ['%LOCALAPPDATA%\Temp', '%LOCALAPPDATA%\Packages', '%LOCALAPPDATA%\Microsoft\Windows\WebCache']
min_age_hours = 336
skip_markers = true

[[target]]
id = "empty-folders"
name = "Empty folders"
group = "Deep Clean"
level = "expert"
description = "Empty folders in AppData untouched for 30 days. Windows and Store app folders are skipped."
paths = ['%LOCALAPPDATA%', '%APPDATA%']
exclude_paths = ['%LOCALAPPDATA%\Microsoft', '%APPDATA%\Microsoft', '%LOCALAPPDATA%\Packages', '%LOCALAPPDATA%\Programs', '%LOCALAPPDATA%\Temp']
empty_dirs = true
min_age_hours = 720

# ─────────────────────────────── Privacy ──────────────────────────────

[[target]]
id = "explorer-mru"
name = "Run, address bar & search history"
group = "Privacy"
level = "recommended"
default_on = false
description = "Win+R history, typed Explorer paths and Explorer search history."
special = "explorer-mru"

[[target]]
id = "recent-items"
name = "Recent items"
group = "Privacy"
level = "recommended"
default_on = false
description = "Recently opened file shortcuts. Pinned Jump List items are kept."
paths = ['%APPDATA%\Microsoft\Windows\Recent']
include = ["*.lnk"]
recursive = false

[[target]]
id = "firefox-cookies"
name = "Mozilla Firefox cookies"
group = "Privacy"
level = "expert"
description = "Signs you out of websites."
paths = ['%APPDATA%\Mozilla\Firefox\Profiles\*\cookies.sqlite', '%APPDATA%\Mozilla\Firefox\Profiles\*\cookies.sqlite-wal']
processes = ["firefox.exe"]

# ─────────────────────────────── Advanced ─────────────────────────────

[[target]]
id = "windows-old"
name = "Previous Windows installation"
group = "Advanced"
level = "expert"
admin = true
description = "Windows.old. Frees a lot of space after an upgrade, but you can no longer roll back."
paths = ['%SystemDrive%\Windows.old']
special = "cleanmgr"
cleanmgr = ["Previous Installations"]

[[target]]
id = "component-store"
name = "Windows component store cleanup"
group = "Advanced"
level = "expert"
admin = true
description = "Removes superseded Windows component versions (DISM). Takes several minutes."
special = "dism"

[[target]]
id = "old-drivers"
name = "Old driver versions"
group = "Advanced"
level = "expert"
admin = true
description = "Older copies of third-party drivers in the driver store. The newest version is kept; drivers in use are never removed."
special = "old-drivers"

[[target]]
id = "installer-orphans"
name = "Orphaned installer packages"
group = "Advanced"
level = "expert"
admin = true
description = ".msi/.msp files in C:\\Windows\\Installer that no installed program references."
special = "installer-orphans"

[[target]]
id = "restore-points"
name = "Old restore points"
group = "Advanced"
level = "expert"
admin = true
description = "Deletes every System Restore point except the newest one."
special = "restore-points"

[[target]]
id = "event-logs"
name = "Windows event logs"
group = "Advanced"
level = "expert"
admin = true
description = "Clears every event log. Only do this if you don't need them for troubleshooting."
special = "event-logs"

[[target]]
id = "prefetch"
name = "Prefetch data"
group = "Advanced"
level = "expert"
admin = true
description = "Not recommended: Windows uses these files to start apps faster. They are rebuilt over time."
paths = ['%SystemRoot%\Prefetch']
include = ["*.pf"]

