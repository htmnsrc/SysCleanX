# SysCleanX built-in cleaning targets.
#
# Fields: id, name, group, level (safe|recommended|expert), description, admin,
# paths (%ENV% + * ? wildcards), profile_subpaths, subpaths, include, exclude,
# exclude_paths, min_age_hours, recursive, remove_root, skip_markers, empty_dirs,
# processes, services, special, cleanmgr, resolver, default_on.
#
# Folders listed in `paths` are emptied (the folder itself is kept); files are deleted.
# Every path still passes the hard-coded safety guard in guard.rs.

# ─────────────────────────────── System ───────────────────────────────

[[target]]
id = "user-temp"
name = "User temporary files"
group = "System"
level = "safe"
description = "Temp folders of every user account. Files touched in the last 24 hours are kept."
paths = ['%TEMP%', '%LOCALAPPDATA%\Temp', '%SystemDrive%\Users\*\AppData\Local\Temp']
min_age_hours = 24

[[target]]
id = "windows-temp"
name = "Windows temporary files"
group = "System"
level = "safe"
admin = true
description = "System-wide temp folder. Files touched in the last 24 hours are kept."
paths = ['%SystemRoot%\Temp']
min_age_hours = 24

[[target]]
id = "recycle-bin"
name = "Recycle Bin"
group = "System"
level = "safe"
description = "Empties the Recycle Bin on all drives."
special = "recycle-bin"

[[target]]
id = "windows-update"
name = "Windows Update cache"
group = "System"
level = "recommended"
admin = true
description = "Downloads of updates that are already installed. Windows Update is paused while cleaning."
paths = ['%SystemRoot%\SoftwareDistribution\Download']
services = ["wuauserv", "bits"]

[[target]]
id = "delivery-optimization"
name = "Delivery Optimization cache"
group = "System"
level = "safe"
admin = true
description = "Update files cached for sharing with other PCs."
paths = ['%SystemRoot%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache']
services = ["DoSvc"]

[[target]]
id = "error-reports"
name = "Windows error reports"
group = "System"
level = "safe"
description = "Queued and archived Windows Error Reporting files."
paths = [
  '%ProgramData%\Microsoft\Windows\WER\ReportArchive',
  '%ProgramData%\Microsoft\Windows\WER\ReportQueue',
  '%ProgramData%\Microsoft\Windows\WER\Temp',
  '%LOCALAPPDATA%\Microsoft\Windows\WER\ReportArchive',
  '%LOCALAPPDATA%\Microsoft\Windows\WER\ReportQueue',
]

[[target]]
id = "memory-dumps"
name = "Memory dumps"
group = "System"
level = "recommended"
description = "Crash dumps from blue screens and app crashes. Only useful for diagnosing crashes."
paths = ['%SystemRoot%\MEMORY.DMP', '%SystemRoot%\Minidump', '%SystemRoot%\LiveKernelReports', '%LOCALAPPDATA%\CrashDumps']
include = ["*.dmp"]

[[target]]
id = "windows-logs"
name = "Windows log files"
group = "System"
level = "recommended"
admin = true
description = "Setup, servicing and update logs older than 7 days."
paths = [
  '%SystemRoot%\Logs\CBS',
  '%SystemRoot%\Logs\DISM',
  '%SystemRoot%\Logs\MoSetup',
  '%SystemRoot%\Logs\WindowsUpdate',
  '%SystemRoot%\Logs\SIH',
  '%SystemRoot%\Logs\waasmedic',
  '%SystemRoot%\Logs\NetSetup',
  '%SystemRoot%\debug',
]
include = ["*.log", "*.etl", "*.cab", "*.log.old"]
min_age_hours = 168

[[target]]
id = "thumbnail-cache"
name = "Thumbnail & icon cache"
group = "System"
level = "recommended"
description = "Explorer rebuilds it automatically. Files Explorer is using are skipped."
paths = ['%LOCALAPPDATA%\Microsoft\Windows\Explorer', '%LOCALAPPDATA%\IconCache.db']
include = ["thumbcache_*.db", "iconcache_*.db", "IconCache.db"]
recursive = false

[[target]]
id = "shader-cache"
name = "DirectX & GPU shader caches"
group = "System"
level = "recommended"
default_on = false
description = "Rebuilt automatically. Games may stutter briefly the first time they start afterwards."
paths = [
  '%LOCALAPPDATA%\D3DSCache',
  '%LOCALAPPDATA%\NVIDIA\DXCache',
  '%LOCALAPPDATA%\NVIDIA\GLCache',
  '%LOCALAPPDATA%\NVIDIA Corporation\NV_Cache',
  '%LOCALAPPDATA%\AMD\DxCache',
  '%LOCALAPPDATA%\AMD\DxcCache',
  '%LOCALAPPDATA%\AMD\GLCache',
  '%LOCALAPPDATA%\AMD\VkCache',
  '%LOCALAPPDATA%\Intel\ShaderCache',
  '%USERPROFILE%\AppData\LocalLow\NVIDIA\PerDriverVersion\DXCache',
  '%USERPROFILE%\AppData\LocalLow\NVIDIA\PerDriverVersion\GLCache',
]

[[target]]
id = "gpu-installers"
name = "GPU driver installer leftovers"
group = "System"
level = "recommended"
description = "Extracted NVIDIA/AMD driver setup files and downloaded driver packages."
paths = ['%SystemDrive%\NVIDIA', '%SystemDrive%\AMD', '%ProgramData%\NVIDIA Corporation\Downloader']

[[target]]
id = "store-app-temp"
name = "Store app temporary files"
group = "System"
level = "recommended"
description = "Temp and web cache folders of Microsoft Store apps."
paths = ['%LOCALAPPDATA%\Packages\*\AC\Temp', '%LOCALAPPDATA%\Packages\*\AC\INetCache', '%LOCALAPPDATA%\Packages\*\TempState']
min_age_hours = 24

[[target]]
id = "windows-upgrade-leftovers"
name = "Windows upgrade leftovers"
group = "System"
level = "recommended"
admin = true
description = "Temporary setup files, upgrade logs and install media left by feature updates (via Windows Disk Cleanup)."
paths = ['%SystemDrive%\$Windows.~BT', '%SystemDrive%\$Windows.~WS', '%SystemDrive%\ESD']
special = "cleanmgr"
cleanmgr = ["Temporary Setup Files", "Windows Upgrade Log Files", "Upgrade Discarded Files", "Windows ESD installation files", "Setup Log Files"]

# ─────────────────────────────── Browsers ─────────────────────────────
# Chromium browsers are generated from [[chromium]] entries at the end of this file
# (cache target in "Browsers", history + cookies targets in "Privacy").

[[target]]
id = "firefox"
name = "Mozilla Firefox"
group = "Browsers"
level = "safe"
description = "Cache, startup cache, thumbnails and crash reports for every profile."
paths = [
  '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2',
  '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\startupCache',
  '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\thumbnails',
  '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\jumpListCache',
  '%APPDATA%\Mozilla\Firefox\Profiles\*\shader-cache',
  '%APPDATA%\Mozilla\Firefox\Crash Reports\submitted',
  '%APPDATA%\Mozilla\Firefox\Crash Reports\pending',
]
processes = ["firefox.exe"]

[[target]]
id = "librewolf"
name = "LibreWolf"
group = "Browsers"
level = "safe"
paths = ['%LOCALAPPDATA%\librewolf\Profiles\*\cache2', '%LOCALAPPDATA%\librewolf\Profiles\*\startupCache']
processes = ["librewolf.exe"]

[[target]]
id = "waterfox"
name = "Waterfox"
group = "Browsers"
level = "safe"
paths = ['%LOCALAPPDATA%\Waterfox\Profiles\*\cache2', '%LOCALAPPDATA%\Waterfox\Profiles\*\startupCache']
processes = ["waterfox.exe"]

[[target]]
id = "inet-cache"
name = "Internet Explorer & legacy web cache"
group = "Browsers"
level = "safe"
description = "WinINet cache used by Internet Explorer mode and older apps."
paths = ['%LOCALAPPDATA%\Microsoft\Windows\INetCache']

