[package]
name = "syscleanx-core"
description = "SysCleanX cleaning engine and Windows integration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading"] }
winreg = "0.56.0"
