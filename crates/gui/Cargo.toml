[package]
name = "syscleanx"
description = "SysCleanX desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false }
syscleanx-core = { path = "../core" }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[features]
# Dev only: EFRAME_SCREENSHOT_TO=out.png saves the 2nd frame and exits.
screenshot = ["eframe/__screenshot", "egui/monochrome_emoji_fonts"]
